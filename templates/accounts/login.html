
{% extends 'base.html' %}

{% block title %}Login | EduTrack{% endblock %}

{% block public_content %}

<div class="auth-card">

    <h1>Welcome back</h1>

    <p class="auth-description">
        Log in to access your EduTrack academic workspace.
    </p>

    <form method="POST" class="auth-form">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="primary-button">
            Login to EduTrack
        </button>
    </form>

    <p class="auth-footer">
        Don't have an account?
        <a href="{% url 'accounts:register' %}">Create an account</a>
    </p>

</div>

{% endblock %}
