
{% if page_obj.paginator.num_pages > 1 %}

<nav class="pagination" aria-label="Pagination">

    {% if page_obj.has_previous %}
        <a href="?q={{ search_query|urlencode }}&subject={{ selected_subject|urlencode }}&status={{ publication_status|urlencode }}&page={{ page_obj.previous_page_number }}"
           class="pagination-link">
            Previous
        </a>
    {% else %}
        <span class="pagination-disabled">Previous</span>
    {% endif %}

    <span class="pagination-current">
        Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}
    </span>

    {% if page_obj.has_next %}
        <a href="?q={{ search_query|urlencode }}&subject={{ selected_subject|urlencode }}&status={{ publication_status|urlencode }}&page={{ page_obj.next_page_number }}"
           class="pagination-link">
            Next
        </a>
    {% else %}
        <span class="pagination-disabled">Next</span>
    {% endif %}

</nav>

{% endif %}
